defaults:
  - _self_
  - data: franka_push

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 8
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True
learning_seed: 41 #0~18,446,744,073,709,551,615

trainer:
  max_epochs: 10 
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 16
  num_workers: ${num_workers}
  persistent_workers: False
  # prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: shonosukehida
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192
  prop_dim: 8 # 生のproprioception次元
  prop_embed_dim: 32 # MLPが出力するproprio潜在の次元


predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.5 #0.09
    kwargs:
      knots: 17
      num_proj: 1024
  idm:
    use: true
    hidden_dim: 256 #256
    weight: 0.0
