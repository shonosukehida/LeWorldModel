defaults:
  - _self_
  - data: upper_flip_mug

output_model_name: upper_jepa
output_dir: outputs/upper_jepa/flip_mug
normalization_stats_path: null  # populated with this run's train-only process_stats.npz
num_workers: 8
train_split: 0.9
seed: 3072
learning_seed: 41
img_size: 224
patch_size: 14
encoder_scale: tiny
projector_hidden_dim: 2048

trainer:
  max_epochs: 10
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 50

loader:
  batch_size: 16
  num_workers: ${num_workers}
  persistent_workers: false
  pin_memory: true
  drop_last: false

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3
scheduler:
  type: LinearWarmupCosineAnnealingLR

wandb:
  enabled: true
  config:
    entity: shonosukehida
    project: lewm
    resume: allow
    log_model: false

wm:
  type: upper_jepa
  horizon: 4
  history_size: 3
  num_preds: 1
  use_action_delta: true
  embed_dim: 192
  prop_dim: 8
  prop_embed_dim: 32

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.5
    kwargs:
      knots: 17
      num_proj: 1024
  idm:
    use: true
    hidden_dim: 256
    weight: 0.1
