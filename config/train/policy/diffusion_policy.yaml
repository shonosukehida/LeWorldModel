defaults:
  - _self_
  - data: flip_mug

output_model_name: diffusion_policy

learning_seed: 41
seed: 3072

device: cuda

img_size: 224
train_split: 0.9



# Dataset
data:
  dataset:
    name: flip_mug/ep2_tm300/push #flip_mug/ep200_tm300/push

    # train_policy.py 側で
    # policy.pred_horizon に上書きする
    num_steps: 16

    frameskip: 1



# Diffusion Policy
policy:
  action_key: action_cartesian

  # full action trajectory generated by diffusion
  pred_horizon: 16 #16

  # number of observations used for conditioning
  obs_horizon: 2 #2

  # chunk used by standalone DP
  action_horizon: 8 #8



# Observation encoder
encoder:
  pretrained: false



# ConditionalUnet1D
model:
  diffusion_step_embed_dim: 256

  down_dims:
    - 256
    - 512
    - 1024

  kernel_size: 5
  n_groups: 8

  cond_predict_scale: true


# Diffusion scheduler
diffusion:
  num_train_timesteps: 100

  # official Diffusion Policy style
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon

  # initially same as training steps
  num_inference_steps: 100


#DataLoader
loader:
  batch_size: 16 #64
  num_workers: 8
  pin_memory: true
  persistent_workers: false



optimizer:
  lr: 1e-4
  weight_decay: 1e-6


trainer:
  max_epochs: 1
  gradient_clip_val: 1.0


wandb:
  enabled: true
  entity: shonosukehida
  project: lewm