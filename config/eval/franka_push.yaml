defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/FrankaPush-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 50
  history_size: 1
  frame_skip: 1
  env_type: single
  ob_type: pixels
  multiview: False
  width: 64
  height: 64
  visualize_info: False
  terminate_at_goal: True
  config:
    model_path: mujoco_menagerie/franka_emika_panda/scene.xml
    camera_name: top_reverse
    image_size: [64, 64]
    confirm_ik_result: False
    tol: 0.05
    target_sampling_step: 1
    substeps: 200

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    # - action_joint
    # - action_cartesian
    - qpos
    - qvel
    - bluebox_pos

seed: 42
policy: lewm_weights 

plan_config:
  horizon: 5 #CEMの計算horizon
  receding_horizon: 5
  action_block: 1
  action_space: "joint" #cartesian / joint
  warm_start: false
  clip_action: false

eval:

  num_eval: 1 #1
  eval_budget: 2000 #50
  img_size: 64
  dataset_name: franka/pairs_100_ep_1_timestep_500_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse/push #franka/pairs_500_ep_1_timestep_500_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse/push #franka/pairs_1_ep_1_timestep_500_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse/push
  ac_cost_dataset_name: franka/val_cost_pairs_1_ep_1_timestep_1000_sample_towards_bluebox_view_top_reverse/push

  eval_tr_ds:
    execute: false
    goal_offset_steps: 25 #25

  eval_zeroshot:
    execute: true
    num_eval: 1 #1
    # goal_offset_steps: 25 #25
    img_size: 64
    start_positions: [0.50, 0.05, 0.05] #[0.50, 0.05, 0.05]
    goal_positions: [0.50, 0.15, 0.05] #[0.50, 0.15, 0.05]
    init_ee_positions: [0.50, 0.0, 0.05] #[0.50, 0.00, 0.05]
    plot_joint_compare_normed: true
  
  compute_opt_action_cost:
    execute: true
    horizon: 5


  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel

    - method: set_bluebox_pos
      args:
        bluebox_pos:
          value: bluebox_pos

    - method: set_goal_pos
      args:
        goal_pos:
          value: bluebox_pos
          offset: ${eval.eval_tr_ds.goal_offset_steps}

output:
  filename: franka_push_results.txt


probing:
  exe_probe: false
  dataset_name: ${eval.dataset_name}
  val_dataset_name: franka/val_pairs_1_ep_2_timestep_200_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse/push
  plot_all_train_data: true
  plot_all_val_data: true
  plot_open_data: false
  plot_closed_data: true
  closed_pred_step: 1
  max_samples: 1000 #pcaで可視化する際に集める潜在列のステップ数
  plot_line: true #pca でclosed forward を可視化するときに１本線にするか否か