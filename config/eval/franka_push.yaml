defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/FrankaPush-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 50
  history_size: 1
  frame_skip: 1
  env_type: single
  ob_type: pixels
  multiview: False
  width: 64
  height: 64
  visualize_info: False
  terminate_at_goal: True
  config:
    model_path: mujoco_menagerie/franka_emika_panda/scene.xml
    camera_name: top_reverse1
    image_size: [64, 64]
    confirm_ik_result: False
    tol: 0.05
    target_sampling_step: 1
    substeps: 200

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    # - action
    # - action_joint
    - action_cartesian
    - qpos
    - qvel
    - bluebox_pos

seed: 42
policy: lewm_weights 

plan_config:
  horizon: 5 #CEMの計算horizon
  receding_horizon: 5 #buffer にためておくaction step, 貯められたaction は毎ステップ取り出され環境に投入される
  action_block: 1
  action_space: "cartesian" #cartesian / joint
  warm_start: false
  clip_action: true

eval:

  num_eval: 1 #1
  eval_budget: 50 #50
  img_size: 64
  dataset_name: franka/pairs_500_ep_1_timestep_100_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse1_ws_x0p45_0p85_y-0p20_0p20_z0p05_0p05/push #franka/pairs_500_ep_1_timestep_500_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse/push #franka/pairs_1_ep_1_timestep_500_sample_mix_direction_towards_bluebox_1p00_1p00_view_top_reverse/push
  ac_cost_dataset_name: franka/val_cost_pairs_1_ep_1_timestep_500_sample_towards_bluebox_view_top_reverse1_ws_x0p45_0p85_y-0p20_0p20_z0p05_0p05_box0p050/push

  eval_tr_ds:
    execute: false
    goal_offset_steps: 25 #25

  eval_zeroshot:
    execute: true
    num_eval: 1 #1
    # goal_offset_steps: 25 #25
    img_size: 64
    condition_type: "random" # "fixed"/"random"

    random:
      coordinate_type: "polar"
      polar: 
        start_position:
          r_range: [0.02, 0.05]
          theta_range: [0., 180.]
        start_goal_distance: 0.1

        init_ee_positions: [0.0, 0.0, 0.05]
        goal_ee_positions: [0.0 , 0.0, 0.05] 

     

    fixed:
      coordinate_type: "polar" # "cartesian" or "polar"
      cartesian:
        start_positions: [0.75, -0.10 , 0.05] #[0.65, 0.05, 0.05], [0.50, 0.05, 0.05]
        goal_positions: [0.75, 0.05 , 0.05] #[0.65, 0.15, 0.05], [0.50, 0.15, 0.05]
        init_ee_positions: [0.65, 0.0, 0.05] #[0.65, 0.00, 0.05], [0.50, 0.00, 0.05] //ゴール画像のFrankaの位置を指定
        goal_ee_positions: [0.55, 0.15, 0.05] #ゴール画像のFrankaの位置を指定
      polar: #0.0が右、反時計回り、degree想定
        start_positions: [0.05, 90., 0.05] #(r, theta, z)
        goal_positions: [0.15, 90., 0.05] 
        init_ee_positions: [0.0, 0.0, 0.05] 
        goal_ee_positions: [0.10 , 90.0, 0.05] 
    plot_joint_compare_normed: true
  
  compute_opt_action_cost:
    execute: false
    horizon: 5


  probing:
    exe_probe: false
    dataset_name: ${eval.dataset_name}
    val_dataset_name: franka/val_pairs_1_ep_3_timestep_200_sample_towards_bluebox_view_top_reverse1_ws_x0p45_0p85_y-0p20_0p20_z0p05_0p05_box0p050/push
    plot_all_train_data: true
    plot_all_val_data: true
    plot_open_data: true
    plot_closed_data: true
    closed_pred_step: 1
    max_samples: 1000 #pcaで可視化する際に集める潜在列のステップ数
    plot_line: true #pca でclosed forward を可視化するときに１本線にするか否か
    check_isotropy: true
    check_shaded_images:
      check: true
      shaded_dataset_name: franka/shadow_occlusion_probe_box0p05/push



  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel

    - method: set_bluebox_pos
      args:
        bluebox_pos:
          value: bluebox_pos

    - method: set_goal_pos
      args:
        goal_pos:
          value: bluebox_pos
          offset: ${eval.eval_tr_ds.goal_offset_steps}

output:
  filename: franka_push_results.txt


