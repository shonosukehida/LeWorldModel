defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/FrankaPush-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 50
  history_size: 1
  frame_skip: 1
  env_type: single
  ob_type: pixels
  multiview: False
  width: 640
  height: 480
  visualize_info: False
  terminate_at_goal: True
  config:
    model_path: mujoco_menagerie/franka_emika_panda/scene.xml
    camera_name: top_reverse1
    image_size: [64, 64]
    confirm_ik_result: False
    tol: 0.05
    target_sampling_step: 1
    substeps: 200

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    # - action
    # - action_joint
    - action_cartesian
    # - qpos
    # - qvel
    # - bluebox_pos

seed: 42
policy: lewm_weights 

plan_config:
  horizon: 5 #CEMの計算horizon #!5
  receding_horizon: 5 #buffer にためておくaction step, 貯められたaction は毎ステップ取り出され環境に投入される #!5
  action_block: 1
  action_space: "cartesian" #cartesian / joint
  warm_start: false
  clip_action: true

eval:
  num_eval: 1 #1
  eval_budget: 50 #50
  img_size: 224 
  dataset_name: flip_mug/ep200_tm300_gripper/push
  normalization_stats_path: ${oc.env:HOME}/.stable_worldmodel/datasets/flip_mug/ep200_tm300_gripper/process_stats.npz
  ac_cost_dataset_name: null


  # Real xArm flip-mug rollout. action_cartesian follows the training-data
  # layout: [x, y, z, qx, qy, qz, qw, gripper], where gripper is normalized
  # to 0=open and 1=closed.
  real_robot:
    execute: false
    dry_run: false #ハードは動かさずにソフトだけをテストする
    dry_run_image_path: config/eval/start_state/flip_mug/start_state_0.png
    follower_ip: "192.168.1.240"
    max_steps: 300 #50
    control_hz: 10 #0.5
    non_interactive: false
    use_action_projector: true
    goal_image_path: config/eval/goal_state/flip_mug/goal_state_0.png #ゴール画像のパス
    output_dir: ${hydra:runtime.cwd}/real_robot_rollouts/flip_mug
    max_cartesian_delta_m: 0.01 #現在位置との差分 [m] #0.02 #0.04
    max_orientation_delta_rad: 0.0872665  # 0.0872665 = 5deg
    max_joint_delta_rad: 0.03 #0.03
    cartesian_speed_mm_s: 50.0
    joint_speed: 0.15
    workspace_bounds_m:
      - [0.4995, 0.75]
      - [-0.2168, 0.2073]
      - [0.12, 0.4752]
    gripper:
      open_position: 850
      closed_position: 0
      speed: 2000
      max_delta: 0.10
      command_threshold: 0.03
    camera:
      serial: 937622072182
      width: 640
      height: 480
      fps: 30


  probing:
    exe_probe: true
    use_random_encoder: false
    dataset_name: ${eval.dataset_name}
    val_dataset_name: flip_mug/val_ep10_tm300/push #flip_mug/val_ep10_tm300/push
    plot_all_train_data: true
    plot_all_val_data: true
    plot_open_data: true
    plot_closed_data: 
      plot_whisker:  #closed forward をひげ状にプロット
        plot: true
        pred_step: 5
        plot_interval: 5
      plot_pred_horizon: #pred horizon 分の予測をプロット
        plot: true
        pred_horizon: 50
    closed_pred_step: 5
    max_samples: 1000 #pcaで可視化する際に集める潜在列のステップ数
    plot_line: true #pca でclosed forward を可視化するときに１本線にするか否か
    encoder_isotropy: 
      check: true
      max_samples: 1000
      sample_interval: 1

 

    encoder_rgb_pca:
      check: true
      horizon: 300
      is_val: false



  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel

    - method: set_bluebox_pos
      args:
        bluebox_pos:
          value: bluebox_pos

    - method: set_goal_pos
      args:
        goal_pos:
          value: bluebox_pos
          offset: ${eval.eval_tr_ds.goal_offset_steps}

output:
  filename: franka_push_results.txt


